name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ShellCheck and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell syntax
        run: bash -n bin/git-sync-all install.sh test/test-git-sync-all.sh
      - name: Run ShellCheck
        run: shellcheck bin/git-sync-all install.sh test/test-git-sync-all.sh
      - name: Run integration tests
        run: bash test/test-git-sync-all.sh
